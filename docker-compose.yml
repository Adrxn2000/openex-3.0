version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: openex-postgres
    environment:
      POSTGRES_DB: openex
      POSTGRES_USER: openex
      POSTGRES_PASSWORD: openex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openex -d openex"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openex-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # backend, frontend, and ai-service will be added in later days
  # once their Dockerfiles exist (week 1 = backend only, run via ./gradlew bootRun locally)

volumes:
  postgres-data:
