services:
  postgres:
    image: postgres:16-alpine
    container_name: openex-postgres
    environment:
      POSTGRES_DB: openex
      POSTGRES_USER: openex
      POSTGRES_PASSWORD: openex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openex -d openex"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openex-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: openex-backend
    container_name: openex-backend
    ports:
      - "8080:8080"
    environment:
      - MARKET_SIM_URL=http://openex-market-sim:5001
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/openex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  market-sim:
    image: openex-market-sim
    container_name: openex-market-sim
    ports:
      - "5001:5001"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - BACKEND_URL=http://openex-backend:8080

  frontend:
    image: openex-frontend
    container_name: openex-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data: