spring:
  application:
    name: openex-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/openex
    username: openex
    password: openex
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
